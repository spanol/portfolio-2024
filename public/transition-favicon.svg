</defs></g></g><script>function initIntIcon(i){if(i.classList.contains("js-nc-int-icon-loaded")) return;i.classList.add("js-nc-int-icon-loaded");i.closest("svg").addEventListener("click",function(n){i.classList.toggle("nc-int-icon-state-b")});};var intIcons=document.getElementsByClassName("js-nc-int-icon");for(var i=0;intIcons.length>i;i++){initIntIcon(intIcons[i]);}</script><style>.nc-int-icon-rotate{--animation-duration:0.4s;}.nc-int-icon{position:relative;}.nc-int-icon-b{position: absolute;top: calc(50% - 0.5em);left: calc(50% - 0.5em);opacity: 0;}.nc-int-icon-rotate .nc-int-icon-a,.nc-int-icon-rotate .nc-int-icon-b{transition: opacity 0s calc(var(--animation-duration)/2), transform var(--animation-duration); transform-origin: center center;}.nc-int-icon-rotate .nc-int-icon-b{transform: rotate(90deg) scale(0.6);}.nc-int-icon-state-b .nc-int-icon-a{opacity: 0;}.nc-int-icon-state-b .nc-int-icon-b{opacity: 1;}.nc-int-icon-rotate.nc-int-icon-state-b .nc-int-icon-a{transform: rotate(-90deg) scale(0.6);}.nc-int-icon-rotate.nc-int-icon-state-b .nc-int-icon-b{transform: rotate(0);}</style></svg>